[package]
name = "ccsw"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "A Claude Code provider, model, and proxy configuration manager"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
tiktoken-rs = "0.7"
tokio = { version = "1.44", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
